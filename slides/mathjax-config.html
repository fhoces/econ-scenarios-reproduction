<!-- A persistent "back to the landing page" link, present on every slide. remark.js
     renders one slide at a time inside .remark-slide-container elements it toggles
     visibility on, the same way it keeps its own bottom-right slide-number counter
     "present" throughout: that counter isn't per-slide markup either, it's a single
     element remark repositions/relabels on each transition. A real <a> can't be done
     that way (remark owns that element), so this attaches one plain, position:fixed
     link straight to <body>, outside every .remark-slide-container, which has the
     same visual effect: it never moves as slides change because it was never part of
     any slide to begin with. Colors match this deck's existing .nav-btn buttons. -->
<style>
  .site-footer-link {
    position: fixed;
    top: 8px;
    left: 10px;
    z-index: 200;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 11px;
    background: #e8eaf6;
    padding: 2px 8px;
    border-radius: 3px;
    text-decoration: none;
    color: #1a237e;
  }
  .site-footer-link:hover { background: #c5cae9; }
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var a = document.createElement("a");
  a.href = "../index.html";
  a.className = "site-footer-link";
  a.textContent = "← overview";
  document.body.appendChild(a);
});
</script>
