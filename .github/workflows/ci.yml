name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: pip install pytest
      - name: Run the test suite
        run: python -m pytest -q
      - name: Regenerate the explorer grid and fail if it is stale
        run: |
          python slides/make_grid_app.py
          git diff --exit-code --stat explorer/grid.js
